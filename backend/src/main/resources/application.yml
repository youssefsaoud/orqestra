spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: crm-api
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  profiles:
    default: dev
  datasource:
    hikari:
      connection-init-sql: SET default_transaction_read_only = on
    url: ${CRM_DB_URL:jdbc:postgresql://localhost:5432/crm_dev}
    username: ${CRM_DB_USERNAME:crm_app}
    password: ${CRM_DB_PASSWORD:crm_app_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    persist-authorization: false
    doc-expansion: none
    tags-sorter: alpha
    supported-submit-methods: [get, post, put, patch, delete]
  paths-to-match: /api/v1/**
  override-with-generic-response: false

server:
  tomcat:
    max-swallow-size: 12MB
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

crm:
  invitations:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
    ttl-hours: ${INVITATION_TTL_HOURS:24}
    delivery-mode: ${INVITATION_DELIVERY_MODE:smtp}
    preview-enabled: ${INVITATION_PREVIEW_ENABLED:false}
  cors:
    allowed-origin: ${CRM_CORS_ALLOWED_ORIGIN:http://localhost:4200}
  jwt:
    secret: ${CRM_SHOWCASE_JWT_SECRET}
    issuer: orqestra-showcase
    expires-in-seconds: ${CRM_JWT_EXPIRES_IN_SECONDS:3600}
  bootstrap:
    admin:
      enabled: ${CRM_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${CRM_BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
      password: ${CRM_BOOTSTRAP_ADMIN_PASSWORD:change-me}
  demo:
    seed:
      enabled: ${CRM_DEMO_SEED_ENABLED:false}
