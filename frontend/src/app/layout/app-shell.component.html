<a class="skip-link" href="#main-content">Skip to content</a>
<div class="app-shell">
  <button *ngIf="mobileOpen" class="sidebar-backdrop" type="button" aria-label="Close navigation" (click)="closeNavigation()"></button>
  <aside #sidebar id="primary-navigation" class="sidebar" [class.open]="mobileOpen" aria-label="Primary navigation" (keydown)="navigationKeydown($event)">
    <a class="brand" routerLink="/dashboard" (click)="closeNavigation()">
      <img class="brand-symbol" src="assets/brand/orqestra-symbol.png" alt="" width="36" height="36" />
      <span class="brand-copy"><strong>Orqestra</strong><small>Project &amp; Vendor Platform</small></span>
    </a>

    <nav>
      <section class="nav-group" *ngFor="let group of navGroups">
        <button
          *ngIf="group.collapsible; else groupLabel"
          class="nav-group-toggle"
          type="button"
          [attr.aria-expanded]="legacyOpen"
          (click)="legacyOpen = !legacyOpen">
          <span>{{ group.label }}</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
        <ng-template #groupLabel><p class="nav-group-label">{{ group.label }}</p></ng-template>

        <div class="nav-items" *ngIf="!group.collapsible || legacyOpen">
          <a
            *ngFor="let item of visibleItems(group.items)"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            (click)="closeNavigation()">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path [attr.d]="item.icon"></path></svg>
            <span>{{ item.label }}</span>
          </a>
        </div>
      </section>
    </nav>

    <div class="sidebar-footer">
      <span class="security-dot" aria-hidden="true"></span>
      <span>Secure workspace</span>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div class="topbar-brand">
        <button #menuButton class="menu-button" type="button" aria-label="Open navigation" aria-controls="primary-navigation" [attr.aria-expanded]="mobileOpen" (click)="openNavigation()">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        </button>
        <div>
          <strong>Orqestra</strong>
          <span>Project &amp; Vendor Platform</span>
        </div>
      </div>

      <ng-container *ngIf="currentUser$ | async as user; else anonymous">
        <div class="user-menu">
          <span class="avatar" aria-hidden="true">{{ initials(user.fullName) }}</span>
          <span class="user-copy"><strong>{{ user.fullName }}</strong><small>{{ roleLabel(user.role) }}</small></span>
          <button class="logout-button" type="button" aria-label="Sign out" (click)="logout()">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
            <span>Sign out</span>
          </button>
        </div>
      </ng-container>
      <ng-template #anonymous><a class="login-link" routerLink="/login">Sign in</a></ng-template>
    </header>

    <main id="main-content" class="content" tabindex="-1" appResponsiveTables><router-outlet></router-outlet></main>
  </div>
</div>
